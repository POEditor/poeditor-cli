# Release build: https://goreleaser.com
# Local check without publishing: goreleaser release --snapshot --clean
version: 2

project_name: poeditor

builds:
  - main: ./cmd/poeditor
    binary: poeditor
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/POEditor/poeditor-cli/internal/build.Version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

release:
  # -rc / -beta tags are marked as pre-releases on GitHub.
  prerelease: auto

# Both repos are updated with TAP_GITHUB_TOKEN: GITHUB_TOKEN can only write to this repo.
homebrew_casks:
  - name: poeditor
    repository:
      owner: POEditor
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    skip_upload: auto # pre-release tags leave the tap alone
    homepage: https://github.com/POEditor/poeditor-cli
    description: Command-line client for POEditor
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    hooks:
      post:
        # The binaries are not notarized yet; without this macOS refuses to run them.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/poeditor"]
          end

scoops:
  - name: poeditor
    repository:
      owner: POEditor
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    skip_upload: auto # pre-release tags leave the bucket alone
    homepage: https://github.com/POEditor/poeditor-cli
    description: Command-line client for POEditor
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
