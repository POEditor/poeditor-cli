# Release build: https://goreleaser.com
# Local check without publishing: goreleaser release --snapshot --clean
version: 2

project_name: poeditor

builds:
  - main: ./cmd/poeditor
    binary: poeditor
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/POEditor/poeditor-cli/internal/build.Version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

release:
  draft: true
